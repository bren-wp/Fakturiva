plugins { id 'com.android.application' }
android {
    namespace 'com.brendigo.fakturiva'
    compileSdk 36
    useLibrary "android.test.base"
    useLibrary "android.test.runner"
    defaultConfig {
        applicationId 'com.brendigo.fakturiva'
        minSdk 24
        targetSdk 36
        versionCode 19
        versionName '0.17.0-preview.1'
        // Android 16 no longer loads the legacy instrumentation runner.
        // AndroidX test runner is packaged only into the androidTest APK.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    // All production/runtime features use Android framework APIs.
    // No AndroidX dependency is packaged into the Fakturiva production APK.
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
