plugins { id 'com.android.application' }
android {
    namespace 'com.brendigo.fakturiva'
    compileSdk 36
    buildFeatures { buildConfig true }
    useLibrary "android.test.base"
    useLibrary "android.test.runner"
    defaultConfig {
        manifestPlaceholders = [appName: 'Fakturiva']
        applicationId 'com.brendigo.fakturiva'
        minSdk 24
        targetSdk 36
        versionCode 23
        versionName '0.18.3-preview.1'
        // Android 16 no longer loads the legacy instrumentation runner.
        // AndroidX test runner is packaged only into the androidTest APK.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        // Separate installable QA-only application, never a shared cloud login.
        demo {
            initWith debug
            applicationIdSuffix '.demo'
            versionNameSuffix '-demo'
            manifestPlaceholders = [appName: 'Fakturiva DEMO']
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    // Official SUNMI inner-printer SDK, Apache 2.0; activated only on SUNMI hardware.
    // Card payments are not part of this library or Fakturiva.
    implementation 'com.sunmi:printerlibrary:1.0.24'
    // All other runtime paths use Android framework APIs.
    // No AndroidX UI dependency is packaged intentionally.
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
