name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify monetary and encrypted-backup core
        run: |
          mkdir -p build/smoke
          javac -d build/smoke app/src/main/java/com/brendigo/fakturiva/Money.java app/src/main/java/com/brendigo/fakturiva/SecureBackup.java app/src/main/java/com/brendigo/fakturiva/Oib.java app/src/main/java/com/brendigo/fakturiva/IsoDates.java app/src/main/java/com/brendigo/fakturiva/Iban.java quality/NativeCoreSmoke.java
          java -cp build/smoke com.brendigo.fakturiva.NativeCoreSmoke
      - name: Verify USB print stream integrity and no-replay failure behavior
        run: |
          javac -d build/smoke app/src/main/java/com/brendigo/fakturiva/EscPosChunkedOutputStream.java quality/UsbPrinterChunkSmoke.java
          java -cp build/smoke com.brendigo.fakturiva.UsbPrinterChunkSmoke
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify visual auditor arithmetic (not app parity)
        run: |
          python -m pip install -r quality/requirements.txt
          python -m unittest discover -s quality -p 'test_*.py' -v
      - name: Full-source static security inventory and dead-code candidates
        run: python3 quality/code_security_audit.py
      - name: Save static code audit for manual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Fakturiva-static-security-dead-code-audit
          path: build/code-security-audit.json
          if-no-files-found: warn
      - name: Compile app and lint
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Fakturiva-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
