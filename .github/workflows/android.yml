name: Android verification
on:
  push:
    branches: [main, feature/native-android-offline]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify monetary and encrypted-backup core
        run: |
          mkdir -p build/smoke
          javac -d build/smoke app/src/main/java/com/brendigo/fakturiva/Money.java app/src/main/java/com/brendigo/fakturiva/SecureBackup.java quality/NativeCoreSmoke.java
          java -cp build/smoke com.brendigo.fakturiva.NativeCoreSmoke
      - name: Compile app and lint
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Fakturiva-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
