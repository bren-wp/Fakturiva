name: Verify native Android screens
on:
  push:
    branches: [feature/v0.9-list-detail-pixel-polish]
  workflow_dispatch:
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[capture]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9-list-detail-pixel-polish
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android application
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi
      - name: Capture genuine emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: false
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            bash ci/capture_screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fakturiva-native-screen-captures
          path: docs/screenshots/*.png
      - name: Commit verified screenshots to pull request
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git diff --cached --quiet || git commit -m "docs: refresh genuine Android screen gallery"
          # CI captures can overlap with updates in the open PR. Rebase only
          # the screenshot commit onto the latest branch head, never force-push.
          git fetch origin feature/v0.9-list-detail-pixel-polish
          git rebase origin/feature/v0.9-list-detail-pixel-polish
          if ! git push origin HEAD:feature/v0.9-list-detail-pixel-polish; then
            echo "::warning::Screenshots captured and uploaded to Actions artifacts. Commit needs GitHub Actions write permission."
            exit 1
          fi
