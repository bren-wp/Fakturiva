name: Verify native Android screens
on:
  pull_request:
    paths:
      - 'app/**'
      - 'ci/**'
      - 'quality/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android application
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi
      - name: Run instrumentation tests and capture genuine APK screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            bash ci/capture_screenshots.sh
      - name: Upload real screenshots and instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fakturiva-Android36-real-screenshots
          path: |
            docs/screenshots/*.png
            build/screenshot-errors.log
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
      # Original 20 reference PNGs are private user-supplied assets and are
      # NOT in the repository. Do not report fabricated pixel parity here.
      # Download this artifact and compare it to the owner's original ZIP with
      # quality/pixel_audit.py, which writes MAE, SSIM and per-pixel diff images.
