name: Verify native Android screens
on:
  push:
    branches: [feature/reliable-documents-ui-release]
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reliable-documents-ui-release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android application
        run: gradle :app:assembleDebug
      - name: Capture genuine emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: bash ci/capture_screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fakturiva-native-screen-captures
          path: docs/screenshots/*.png
      - name: Commit verified screenshots to pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git diff --cached --quiet || git commit -m "docs: add genuine Android emulator screenshots"
          git push origin HEAD:feature/reliable-documents-ui-release
