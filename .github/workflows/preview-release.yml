name: Fakturiva preview distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-preview]')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows portable and complete distribution
        shell: pwsh
        run: |
          dotnet restore win/Fakturiva.Win.csproj
          dotnet publish win/Fakturiva.Win.csproj -c Release -r win-x64 --self-contained true -o win/publish
          if (!(Test-Path win/publish/Fakturiva.exe)) { throw "Windows executable missing" }
          New-Item -ItemType Directory build/windows -Force | Out-Null
          Copy-Item win/publish/Fakturiva.exe build/windows/Fakturiva-portable.exe
          Compress-Archive -Path win/publish/* -DestinationPath build/windows/Fakturiva-portable-complete.zip -Force
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          Push-Location win
          try {
            & $compiler installer.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          } finally { Pop-Location }
          if (!(Test-Path win/build/Fakturiva-setup.exe)) { throw "Setup missing" }
          Copy-Item win/build/Fakturiva-setup.exe build/windows/Fakturiva-setup.exe
      - name: Upload verified Windows preview assets
        uses: actions/upload-artifact@v7
        with:
          name: Fakturiva-Windows-preview
          path: build/windows/*
          if-no-files-found: error
  publish-preview:
    needs: [windows-preview]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Read current app version (never hard-code release filenames)
        run: |
          VERSION="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*$/\1/p" app/build.gradle)"
          test -n "$VERSION"
          case "$VERSION" in *preview*) ;; *) echo "::error::Only preview packages may be released by this workflow"; exit 1;; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          NOTES="docs/V${VERSION%%-preview.*}_RELEASE_NOTES.md"
          test -s "$NOTES" || { echo "::error::Release notes missing: $NOTES"; exit 1; }
      - name: Verify money, OIB, dates, crypto and backup guards
        run: |
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/com/brendigo/fakturiva/Money.java \
            app/src/main/java/com/brendigo/fakturiva/SecureBackup.java \
            app/src/main/java/com/brendigo/fakturiva/Oib.java \
            app/src/main/java/com/brendigo/fakturiva/IsoDates.java \
            app/src/main/java/com/brendigo/fakturiva/Iban.java \
            quality/NativeCoreSmoke.java
          java -cp build/smoke com.brendigo.fakturiva.NativeCoreSmoke
      - name: Build and lint actual Android APK / AAB
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleDebug :app:bundleRelease :app:lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Verify 20 actual screens and Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: bash ci/run_android_qa.sh
      - name: Preserve tested emulator screenshots and instrumentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Fakturiva-release-${{ env.VERSION }}-real-screens
          path: |
            docs/screenshots/*.png
            docs/screenshots/*.xml
            build/screenshot-errors.log
            build/instrumentation.log
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
      - name: Refresh README gallery from freshly tested Android screenshots
        run: |
          test "$(find docs/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 20
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots match committed captures."
          else
            git commit -m "docs: refresh 20 authentic Android screenshots for v${VERSION}"
            git push origin HEAD:main
          fi
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify debug-signing (not a production Google Play signature)
        run: jarsigner -verify app/build/outputs/bundle/debug/app-debug.aab
      - name: Download matching Windows setup and portable artifacts
        uses: actions/download-artifact@v8
        with:
          name: Fakturiva-Windows-preview
          path: build/publish
      - name: Package private-data-free PHP web bundle and source archive
        run: |
          test -s build/publish/Fakturiva-setup.exe
          test -s build/publish/Fakturiva-portable.exe
          test -s build/publish/Fakturiva-portable-complete.zip
          mkdir -p build/publish
          git archive --format=zip --output="build/publish/Fakturiva-v${VERSION}-source.zip" HEAD
          (cd web && zip -q -r "../build/publish/Fakturiva-v${VERSION}-web.zip" . \
            -x "storage/data/*" "storage/secret.php" ".env" ".env.*" "*.log" \
               "*/secret.php" "*/storage/data/*" "*/storage/secret.php")
          test -s "build/publish/Fakturiva-v${VERSION}-web.zip"
          test -s "build/publish/Fakturiva-v${VERSION}-source.zip"
      - name: Package and checksum verified artifacts
        run: |
          mkdir -p build/publish
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/debug/app-debug.aab
          test -s app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/debug/app-debug.apk "build/publish/Fakturiva-v${VERSION}-debug.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "build/publish/Fakturiva-v${VERSION}-DEBUG-SIGNED.aab"
          cp app/build/outputs/bundle/release/app-release.aab "build/publish/Fakturiva-v${VERSION}-UNSIGNED.aab"
          (cd build/publish && sha256sum *.apk *.aab *.exe *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: Fakturiva-preview-${{ env.VERSION }}-packages
          path: build/publish/*
      - name: Publish GitHub preview release when authorized
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists; refusing to overwrite a published release."
            exit 1
          fi
          if gh release create "v${VERSION}" build/publish/* \
            --target "$RELEASE_TARGET" \
            --title "Fakturiva v${VERSION} — Android, Windows i web pretpregled" \
            --notes-file "docs/V${VERSION%%-preview.*}_RELEASE_NOTES.md" \
            --prerelease; then
            echo "Published verified preview release"
          else
            echo "::error::GitHub Release could not be published. Verified packages remain in workflow artifacts."
            exit 1
          fi
