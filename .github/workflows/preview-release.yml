name: Fakturiva preview distribution
on:
  push:
    branches:
      - feature/autosave-recovery-v0.3
jobs:
  publish-preview:
    if: contains(github.event.head_commit.message, '[release-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify monetary and encryption core
        run: |
          mkdir -p build/smoke
          javac -d build/smoke app/src/main/java/com/brendigo/fakturiva/Money.java app/src/main/java/com/brendigo/fakturiva/SecureBackup.java quality/NativeCoreSmoke.java
          java -cp build/smoke com.brendigo.fakturiva.NativeCoreSmoke
      - name: Compile debug APK, unsigned release AAB and lint
        run: gradle :app:assembleDebug :app:bundleRelease :app:lintDebug --stacktrace
      - name: Package files with transparent signature status
        run: |
          mkdir -p build/publish
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/debug/app-debug.apk build/publish/Fakturiva-v0.3.0-preview.apk
          cp app/build/outputs/bundle/release/app-release.aab build/publish/Fakturiva-v0.3.0-preview-UNSIGNED.aab
          sha256sum build/publish/* > build/publish/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fakturiva-0.3.0-preview-packages
          path: build/publish/*
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0-preview.1 \
            build/publish/Fakturiva-v0.3.0-preview.apk \
            build/publish/Fakturiva-v0.3.0-preview-UNSIGNED.aab \
            build/publish/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Fakturiva v0.3.0 — pretpregled" \
            --notes-file docs/PREVIEW_RELEASE_NOTES.md \
            --prerelease
