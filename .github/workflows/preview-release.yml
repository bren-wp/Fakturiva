name: Fakturiva preview distribution
on:
  push:
    branches:
      - feature/v0.7-pixel-perfect-ui-overhaul
jobs:
  publish-preview:
    if: contains(github.event.head_commit.message, '[release-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify money, OIB, dates and crypto
        run: |
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/com/brendigo/fakturiva/Money.java \
            app/src/main/java/com/brendigo/fakturiva/SecureBackup.java \
            app/src/main/java/com/brendigo/fakturiva/Oib.java \
            app/src/main/java/com/brendigo/fakturiva/IsoDates.java app/src/main/java/com/brendigo/fakturiva/Iban.java \
            quality/NativeCoreSmoke.java
          java -cp build/smoke com.brendigo.fakturiva.NativeCoreSmoke
      - name: Build APK and both preview bundle variants
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleDebug :app:bundleRelease :app:lintDebug --stacktrace
      - name: Verify preview bundle signing
        run: jarsigner -verify app/build/outputs/bundle/debug/app-debug.aab
      - name: Package, name and checksum actual artifacts
        run: |
          mkdir -p build/publish
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/debug/app-debug.aab
          test -s app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/debug/app-debug.apk build/publish/Fakturiva-v0.7.0-preview.1-debug.apk
          cp app/build/outputs/bundle/debug/app-debug.aab build/publish/Fakturiva-v0.7.0-preview.1-DEBUG-SIGNED.aab
          cp app/build/outputs/bundle/release/app-release.aab build/publish/Fakturiva-v0.7.0-preview.1-UNSIGNED.aab
          (cd build/publish && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Fakturiva-0.7.0-preview.1-packages
          path: build/publish/*
      - name: Publish GitHub prerelease when authorized
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release create v0.7.0-preview.1 \
            build/publish/Fakturiva-v0.7.0-preview.1-debug.apk \
            build/publish/Fakturiva-v0.7.0-preview.1-DEBUG-SIGNED.aab \
            build/publish/Fakturiva-v0.7.0-preview.1-UNSIGNED.aab \
            build/publish/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Fakturiva v0.7.0-preview.1 — Android pretpregled" \
            --notes-file docs/PREVIEW_RELEASE_NOTES.md \
            --prerelease; then
            echo "Published GitHub preview release"
          else
            echo "::warning::GitHub Release publishing is blocked by repository workflow token permissions. Verified APK and AAB remain available in Actions artifacts."
          fi
