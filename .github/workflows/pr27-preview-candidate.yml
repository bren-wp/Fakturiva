# Archived PR27 candidate build: manually inspect old artifacts only.
# Immutable releases are published exclusively by preview-release.yml.
name: Fakturiva legacy PR27 candidate (manual build only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: contains(github.event.head_commit.message, '[release-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Install Android SDK
        run: |
          SDK="$ANDROID_HOME"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build all APK and AAB candidates and lint
        run: |
          gradle :app:assembleDebug :app:assembleDemo :app:bundleDebug :app:bundleRelease :app:lintDebug :app:lintDemo --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/demo/app-demo.apk
          test -s app/build/outputs/bundle/debug/app-debug.aab
          test -s app/build/outputs/bundle/release/app-release.aab
          test ! -e app/src/main/java/com/brendigo/fakturiva/DemoSeeder.java
          jarsigner -verify app/build/outputs/bundle/debug/app-debug.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/demo/app-demo.apk
      - name: Package Android builds
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Fakturiva-debug.apk
          cp app/build/outputs/apk/demo/app-demo.apk out/Fakturiva-demo.apk
          cp app/build/outputs/bundle/debug/app-debug.aab out/Fakturiva-DEBUG-SIGNED.aab
          cp app/build/outputs/bundle/release/app-release.aab out/Fakturiva-UNSIGNED.aab
      - uses: actions/upload-artifact@v7
        with:
          name: fakturiva-android-candidate
          path: out/*
          if-no-files-found: error

  windows:
    if: contains(github.event.head_commit.message, '[release-preview]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows portable
        shell: pwsh
        run: |
          dotnet restore win/Fakturiva.Win.csproj
          dotnet publish win/Fakturiva.Win.csproj -c Release -r win-x64 --self-contained true -o win/publish
          if (!(Test-Path win/publish/Fakturiva.exe)) { throw "Missing Fakturiva.exe" }
          New-Item -ItemType Directory out -Force | Out-Null
          Copy-Item win/publish/Fakturiva.exe out/Fakturiva-portable.exe
          Compress-Archive -Path win/publish/* -DestinationPath out/Fakturiva-portable-complete.zip -Force
      - name: Build setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup missing" }
          Push-Location win
          try {
            & $compiler installer.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          } finally { Pop-Location }
          if (!(Test-Path win/build/Fakturiva-setup.exe)) { throw "Missing setup.exe" }
          Copy-Item win/build/Fakturiva-setup.exe out/Fakturiva-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: fakturiva-windows-candidate
          path: out/*
          if-no-files-found: error

