name: Responsive Android screen matrix
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ci/**'
      - 'quality/**'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/responsive.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'ci/**'
      - '.github/workflows/responsive.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Physical resolution, Android dpi and resulting logical dp sizes.
          # AOSP image avoids a Google Pixel Launcher first-boot ANR on mini-280.
          # This profile still captures and verifies all 20 actual app screens.
          - {profile: mini-280,         width: 560,  height: 1120, density: 320, font: '1.0', target: default}
          - {profile: compact-320-font, width: 640,  height: 1136, density: 320, font: '1.3'}
          - {profile: phone-360,        width: 1080, height: 2400, density: 480, font: '1.0'}
          - {profile: reference-393,    width: 1179, height: 2556, density: 480, font: '1.0'}
          - {profile: large-430,        width: 1290, height: 2796, density: 480, font: '1.25'}
          - {profile: foldable-600,     width: 1200, height: 1920, density: 320, font: '1.3'}
          - {profile: tablet-800-font,  width: 1600, height: 2560, density: 320, font: '1.5'}
          - {profile: landscape-640,    width: 1280, height: 720,  density: 320, font: '1.0'}
          - {profile: landscape-960,    width: 1920, height: 1200, density: 320, font: '1.3'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android build SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          "$MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build actual debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Stop Gradle daemon before emulator
        run: gradle --stop
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Verify all 20 screens at ${{ matrix.profile }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 15 is used for the large viewport matrix because the API
          # 36 screenshot emulator has shown intermittent ADB disconnects.
          # API 36 JUnit instrumentation is verified independently.
          api-level: 35
          arch: x86_64
          # Keep Google APIs on all other viewports; use lightweight AOSP on
          # mini-280 to avoid a system launcher ANR before screen 01.
          target: ${{ matrix.target || 'google_apis' }}
          profile: pixel_2
          # Android 15 SystemUI and UiAutomator occasionally exhaust a 2 GB AVD
          # during the very first accessibility dump.
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: bash ci/run_responsive_qa.sh "${{ matrix.profile }}" "${{ matrix.width }}" "${{ matrix.height }}" "${{ matrix.density }}" "${{ matrix.font }}"
      - name: Preserve actual screenshots, view hierarchy and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fakturiva-responsive-${{ matrix.profile }}
          path: build/responsive/${{ matrix.profile }}/**
          if-no-files-found: warn
